<!DOCTYPE html>
<html>
<head>
    <title>Navigation Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .button { 
            padding: 10px 15px; 
            margin: 5px; 
            background: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
        }
        .result { margin-top: 10px; padding: 10px; background: #f8f9fa; }
    </style>
</head>
<body>
    <h1>HostNova Navigation Test</h1>
    
    <div class="test-section">
        <h2>Navigation Button Test</h2>
        <p>This test checks if all 5 navigation buttons are properly defined in the main website.</p>
        <button class="button" onclick="testNavigation()">Test Navigation Buttons</button>
        <div id="nav-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Section Test</h2>
        <p>This test checks if all 5 sections exist in the main website.</p>
        <button class="button" onclick="testSections()">Test Sections</button>
        <div id="section-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Open Main Website</h2>
        <p>Click to open the main website and test the navigation manually.</p>
        <button class="button" onclick="openMainSite()">Open HostNova Website</button>
    </div>

    <script>
        function testNavigation() {
            // Open the main site in an iframe to test
            const iframe = document.createElement('iframe');
            iframe.src = 'index.html';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            
            iframe.onload = function() {
                const doc = iframe.contentDocument;
                const navButtons = doc.querySelectorAll('.section-nav-button');
                const result = document.getElementById('nav-result');
                
                if (navButtons.length === 5) {
                    result.innerHTML = `<span style="color: green;">✓ SUCCESS: Found ${navButtons.length} navigation buttons</span><br>`;
                    navButtons.forEach((btn, index) => {
                        const section = btn.getAttribute('data-section');
                        const label = btn.querySelector('.section-nav-label').textContent;
                        result.innerHTML += `Button ${index + 1}: data-section="${section}", label="${label}"<br>`;
                    });
                } else {
                    result.innerHTML = `<span style="color: red;">✗ FAILED: Found ${navButtons.length} navigation buttons (expected 5)</span>`;
                }
                
                document.body.removeChild(iframe);
            };
        }

        function testSections() {
            const iframe = document.createElement('iframe');
            iframe.src = 'index.html';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            
            iframe.onload = function() {
                const doc = iframe.contentDocument;
                const sections = doc.querySelectorAll('#hero, .hostara-section, .business-hostara-section, .consumer-section, .pricing-section');
                const result = document.getElementById('section-result');
                
                if (sections.length === 5) {
                    result.innerHTML = `<span style="color: green;">✓ SUCCESS: Found ${sections.length} sections</span><br>`;
                    sections.forEach((section, index) => {
                        const className = section.className || section.id;
                        result.innerHTML += `Section ${index + 1}: ${className}<br>`;
                    });
                } else {
                    result.innerHTML = `<span style="color: red;">✗ FAILED: Found ${sections.length} sections (expected 5)</span>`;
                }
                
                document.body.removeChild(iframe);
            };
        }

        function openMainSite() {
            window.open('index.html', '_blank');
        }
    </script>
</body>
</html>
